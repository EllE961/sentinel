[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Production ML monitoring for a real recommender: input drift (PSI) and output quality, tracked separately -- because one does not substitute for the other."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  # dev: pip install -e ../compass-recsys, then pip install -e . here
  # clean clone: pip install "compass-recsys @ git+https://github.com/EllE961/compass-recsys.git"
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731", "B905", "SIM108", "UP007"]
